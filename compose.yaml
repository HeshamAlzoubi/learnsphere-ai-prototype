# Local-only synthetic demo database. Do not use for real student information.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: learnsphere
      MYSQL_USER: learnsphere_app
      MYSQL_PASSWORD: ${LEARN_DB_PASSWORD:?Set LEARN_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${LEARN_DB_ROOT_PASSWORD:?Set LEARN_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - learnsphere_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  learnsphere_mysql:
