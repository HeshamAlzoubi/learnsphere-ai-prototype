spring.application.name=learnsphere-backend
server.port=8080
server.error.include-message=never
spring.datasource.url=${LEARN_DB_URL:jdbc:mysql://localhost:3306/learnsphere}
spring.datasource.username=${LEARN_DB_USER:learnsphere_app}
spring.datasource.password=${LEARN_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Local-only demonstration: do not expose unauthenticated endpoints publicly.
server.address=${LEARN_BIND_ADDRESS:127.0.0.1}
