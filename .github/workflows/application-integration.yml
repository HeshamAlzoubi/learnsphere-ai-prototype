name: LearnSphere AI - Application Integration Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tools/application_smoke_test.py'
      - '.github/workflows/application-integration.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-integration:
    name: Frontend Proxy, Spring Boot and MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: learnsphere_ci
          MYSQL_USER: learnsphere_ci
          MYSQL_PASSWORD: ci_ephemeral_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      LEARN_DB_URL: jdbc:mysql://127.0.0.1:3306/learnsphere_ci
      LEARN_DB_USER: learnsphere_ci
      LEARN_DB_PASSWORD: ci_ephemeral_only
      LEARN_BIND_ADDRESS: 127.0.0.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Start backend and Vite proxy
        run: |
          set -e
          nohup java -jar backend/target/learnsphere-backend-0.4.0-SNAPSHOT.jar > "$RUNNER_TEMP/learnsphere-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/learnsphere-backend.pid"
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/learnsphere-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/learnsphere-vite.pid"
      - name: Exercise application over HTTP
        run: python3 tools/application_smoke_test.py
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-integration-logs
          path: |
            ${{ runner.temp }}/learnsphere-backend.log
            ${{ runner.temp }}/learnsphere-vite.log
          if-no-files-found: ignore
